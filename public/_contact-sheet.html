<!doctype html>
<html>
<head><meta charset="utf-8"><title>contact sheet</title>
<style>
body{margin:0;background:#111;color:#fff;font:11px monospace}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{position:relative}
.cell img{width:100%;height:260px;object-fit:cover;display:block}
.cell span{position:absolute;bottom:0;left:0;background:#000c;padding:2px 6px}
</style></head>
<body>
<div class="grid" id="g"></div>
<script>
const g=document.getElementById('g');
for(let i=1;i<=21;i++){
  const n=String(i).padStart(2,'0');
  g.insertAdjacentHTML('beforeend',`<div class="cell"><img src="/media/look-${n}.jpg"><span>${n}</span></div>`);
}
</script>
</body>
</html>
