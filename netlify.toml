[build]
  command = "npm run build"
  publish = "dist"

# Serverless checkout (Stripe Embedded Checkout). Functions are matched
# before the SPA fallback below, so /.netlify/functions/* is never rewritten.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback — React Router owns routing, so every path must serve
# index.html or deep links like /lookbook/ss26 404 on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers. The Content-Security-Policy is what lets Stripe.js keep
# its XSS guarantees: scripts only from us and Stripe, the checkout iframe
# only from Stripe, fonts only from Google. Scripts are never inline.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://js.stripe.com https://*.js.stripe.com https://checkout.stripe.com; frame-src https://js.stripe.com https://*.js.stripe.com https://checkout.stripe.com https://hooks.stripe.com; connect-src 'self' https://api.stripe.com https://checkout.stripe.com https://*.stripe.com; img-src 'self' data: blob: https://*.stripe.com; media-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; base-uri 'self'; form-action 'self' https://checkout.stripe.com; frame-ancestors 'none'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\" \"https://checkout.stripe.com\")"
